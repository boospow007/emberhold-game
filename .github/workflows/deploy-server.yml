name: deploy-server
on:
  push:
    branches: [main]
    paths: ['server/**', 'lib/game/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/emberhold
            git fetch --all
            git reset --hard origin/main
            docker compose -f server/docker-compose.yml up -d --build --remove-orphans
            sleep 5
            docker compose -f server/docker-compose.yml exec -T game wget -qO- http://127.0.0.1:8787/health
