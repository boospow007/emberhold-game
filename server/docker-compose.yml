# Run from the repo root on the droplet:  docker compose -f server/docker-compose.yml up -d --build
services:
  game:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    restart: unless-stopped
    expose: ['8787']
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [game]
volumes:
  caddy_data:
  caddy_config:
